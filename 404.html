<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C-PH111 · Exam Questions, Solved · Ammar</title>
<meta name="theme-color" content="#FBF9F5">
<style>
:root{
  --paper:#FBF9F5; --card:#FFFFFF; --ink:#15181D; --muted:#6B7280; --soft:#8A8578;
  --line:#E6E0D6; --line2:#EFEAE1; --teal:#0B6E5F; --teal-soft:#E7F2EF;
  --amber:#8A5310; --amber-soft:#FBF0DE; --red:#B3261E; --red-soft:#FBECEA;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 90px}
.hide{display:none!important}

.bar{position:sticky;top:0;z-index:20;background:rgba(251,249,245,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line2);margin:0 -16px 16px;padding:11px 16px;display:flex;align-items:center;gap:11px}
.bar .back{width:36px;height:36px;flex:none;border:1px solid var(--line);background:var(--card);
  border-radius:11px;font-size:16px;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.bar .back:active{transform:scale(.96)}
.bar .t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.bar .s{font-size:14px;font-weight:650;letter-spacing:-.01em}
.bar .sp{flex:1}
.tally{font-family:var(--mono);font-size:12px;color:var(--teal);font-weight:700}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
h1{font-size:clamp(28px,8vw,38px);line-height:1.04;letter-spacing:-.035em;margin:9px 0 8px;font-weight:800}
h1 em{font-style:normal;color:var(--teal)}
.lead{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:48ch}

.tcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:9px;cursor:pointer;
  font-family:var(--sans);color:var(--ink)}
.tcard:active{transform:scale(.995)}
.tcard .n{width:36px;height:36px;flex:none;border-radius:10px;background:var(--teal-soft);color:var(--teal);
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.tcard .x{flex:1;min-width:0}
.tcard .tt{font-size:15.5px;font-weight:650;letter-spacing:-.015em;display:block}
.tcard .dd{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.tcard .p{font-family:var(--mono);font-size:11px;color:var(--soft);flex:none}
.tcard .p.ok{color:var(--teal);font-weight:700}

.prob{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px}
.ph{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pn{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink);border-radius:6px;padding:2px 7px;font-weight:700}
.pt{font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.pq{font-size:14px;color:#2B3038;margin:0 0 12px;line-height:1.55}

.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:14px 0 7px}
.meth{background:var(--teal-soft);border-radius:12px;padding:12px 13px;counter-reset:m}
.meth p{margin:0 0 8px;padding-left:26px;position:relative;font-size:14px;line-height:1.5;color:#0A3B33}
.meth p:last-child{margin:0}
.meth p::before{counter-increment:m;content:counter(m);position:absolute;left:0;top:0;width:18px;height:18px;
  border-radius:6px;background:var(--teal);color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center;font-weight:700}

details.ans{margin-top:12px;border:1px solid var(--line2);border-radius:12px;background:#FCFAF6;overflow:hidden}
details.ans summary{cursor:pointer;list-style:none;padding:10px 13px;font-size:13px;font-weight:650;color:var(--amber);
  background:var(--amber-soft);display:flex;justify-content:space-between;align-items:center}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary::after{content:"▾";font-size:12px}
details.ans[open] summary::after{content:"▴"}
details.ans .in{padding:12px 13px}
details.ans .ln{font-family:var(--mono);font-size:12.5px;line-height:1.75;margin:0;white-space:pre-wrap;color:#3C3A34}
details.ans .res{margin-top:10px;padding-top:9px;border-top:1px dashed #E3D6BE;font-size:13.5px;font-weight:700;color:#6B3D05}

.try{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
.try .th{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:9px}
.pr{margin-bottom:11px}
.pr:last-child{margin-bottom:0}
.pr .q{font-size:13.5px;margin:0 0 8px;line-height:1.5}

.opts{display:grid;gap:6px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer}
.opt.good{border-color:var(--teal);background:var(--teal-soft);color:#07463C;font-weight:600}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:#7A1A15}
.opt:disabled{cursor:default}
.row{display:flex;gap:7px;align-items:center}
.row input{flex:1;min-width:0;font-family:var(--mono);font-size:14px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.row input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,110,95,.1)}
.row .u{font-family:var(--mono);font-size:12px;color:var(--soft)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:9px 13px;font-size:13px;
  font-weight:600;font-family:var(--sans);cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.w{display:none;margin-top:8px;padding:9px 11px;border-radius:10px;font-size:12.5px;line-height:1.5}
.w.on{display:block}
.w.ok{background:var(--teal-soft);color:#07463C}
.w.no{background:var(--red-soft);color:#7A1A15}

.foot{display:flex;gap:9px;margin-top:14px}
.foot .btn{flex:1;padding:12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:12px;color:var(--soft);text-align:center;margin-top:24px;line-height:1.6}
</style>
</head>

<script>
const P = [{"t": 1, "n": 1, "ttl": "Volume conversion", "q": "A 3×3×3 m block is cut into small pieces of 1×2×0.5 cm. How many pieces?", "m": ["Convert the big block to cm³, then divide by one piece.", "Never convert the small piece up. Always convert the big thing down."], "w": ["3 m = 300 cm → 300 × 300 × 300 = 2.7×10⁷ cm³", "One piece = 1 × 2 × 0.5 = 1 cm³", "2.7×10⁷ ÷ 1"], "a": "2.7 × 10⁷ pieces", "pr": [{"q": "A 2×2×2 m block cut into 2×1×0.5 cm pieces. How many?", "num": 8000000.0, "tol": 100000.0, "unit": "pieces", "why": "200³ = 8×10⁶ cm³, one piece = 1 cm³."}, {"q": "A 1.5 m cube cut into 1×1×1 cm cubes. How many?", "num": 3375000.0, "tol": 10000.0, "unit": "cubes", "why": "150³ = 3.375×10⁶."}]}, {"t": 1, "n": 2, "ttl": "Significant figures", "q": "Count the significant figures in 78.9 ± 0.2, 3.788×10⁹, 2.46×10⁻⁶ and 0.0053.", "m": ["Ignore leading zeros. Count every other digit.", "In scientific notation, only the number in front of ×10 counts."], "w": ["78.9 ± 0.2 → 3 sf (and it is ±0.2, so the doubt is in the first decimal)", "3.788×10⁹ → 4 sf", "2.46×10⁻⁶ → 3 sf", "0.0053 → 2 sf (the zeros in front do not count)"], "a": "3, 4, 3 and 2", "pr": [{"q": "How many significant figures in 0.00450?", "num": 3, "tol": 0, "unit": "sf", "why": "Leading zeros are not significant. The trailing zero after 45 does count."}, {"q": "How many significant figures in 6.020×10²³?", "num": 4, "tol": 0, "unit": "sf", "why": "All four digits of 6.020 count, including the zero between 2 and 0."}]}, {"t": 1, "n": 3, "ttl": "Dimensional check", "q": "Are vf = vi + ax and y = (2 m) cos(kx) dimensionally correct?", "m": ["Write L, T, M for every symbol and multiply it out.", "You may never add L to L/T. One mismatch kills the equation."], "w": ["vf = vi + ax → ax is (L/T²)(L) = L²/T², but v is L/T. Wrong.", "y = 2 cos(kx) → kx is m⁻¹ × m = no unit, so cos gives a pure number, and 2 m stays m. Correct."], "a": "First wrong, second correct.", "pr": [{"q": "Is v² = 2ax dimensionally correct?", "o": ["Correct", "Not correct"], "a": 0, "why": "LHS (L/T)² = L²/T². RHS (L/T²)(L) = L²/T². Same, so correct."}, {"q": "Is x = v t² dimensionally correct?", "o": ["Correct", "Not correct"], "a": 1, "why": "RHS (L/T)(T²) = L T, but x is L. Not correct."}]}, {"t": 1, "n": 4, "ttl": "Unit conversion", "q": "An ore loader moves 1200 t/h. Convert to kg/s (1 t = 1000 kg).", "m": ["Turn tonnes into kg, and hours into seconds, in the same fraction.", "t/h → kg/s is ×1000 ÷ 3600."], "w": ["1200 t/h = 1200 × 1000 kg per 3600 s", "1 200 000 ÷ 3600"], "a": "333.3 kg/s", "pr": [{"q": "Convert 90 km/h to m/s.", "num": 25, "tol": 0.2, "unit": "m/s", "why": "km/h → m/s is ÷3.6. 90 ÷ 3.6 = 25."}, {"q": "Convert 2.5 g/cm³ to kg/m³.", "num": 2500, "tol": 2, "unit": "kg/m³", "why": "1 g/cm³ = 1000 kg/m³, so ×1000."}]}, {"t": 1, "n": 5, "ttl": "Fountain height", "q": "Student measures the pool's circumference C, then the angle of elevation φ to the top of the jet. Find the height.", "m": ["Radius from the circumference: r = C / 2π.", "Height from the right triangle: h = r tan φ."], "w": ["C = 2πr, so r = C ÷ 2π", "tan φ = h ÷ r, so h = r tan φ"], "a": "h = C tan φ / 2π", "pr": [{"q": "C = 31.4 m and φ = 40°. Find h.", "num": 4.2, "tol": 0.12, "unit": "m", "why": "r = 31.4/6.283 = 5 m. h = 5 tan40 = 4.20 m."}, {"q": "C = 62.8 m and φ = 30°. Find h.", "num": 5.77, "tol": 0.15, "unit": "m", "why": "r = 62.8/6.283 = 10 m. h = 10 tan30 = 5.77 m."}]}, {"t": 1, "n": 6, "ttl": "Distance and polar coordinates", "q": "Points (2.00, 24.00) m and (23.00, 3.00) m. Find the distance between them and their polar coordinates.", "m": ["Distance: subtract the x's and the y's, then Pythagoras.", "Polar: r = √(x²+y²), θ = tan⁻¹(y/x) with the quadrant check."], "w": ["d = √((23−2)² + (3−24)²) = √(441+441) = 29.7 m", "P₁: r = √(4+576) = 24.1, θ = tan⁻¹(24/2) = 85.2°", "P₂: r = √(529+9) = 23.2, θ = tan⁻¹(3/23) = 7.4°"], "a": "d = 29.7 m; (24.1 m, 85.2°) and (23.2 m, 7.4°)", "pr": [{"q": "Distance between (1, 2) and (4, 6).", "num": 5, "tol": 0.05, "unit": "m", "why": "√(3² + 4²) = 5."}, {"q": "Polar angle of the point (3, 4), measured from +x.", "num": 53.1, "tol": 0.5, "unit": "°", "why": "tan⁻¹(4/3) = 53.1°, first quadrant so no adjustment."}]}, {"t": 1, "n": 7, "ttl": "Polar to Cartesian", "q": "Polar points (2.50 m, 30.0°) and (3.80 m, 120.0°). Find their Cartesian coordinates and the distance between them.", "m": ["x = r cos θ, y = r sin θ. Cos for the x, sin for the y.", "Then use the normal distance formula on the two new points."], "w": ["P₁: (2.5 cos30, 2.5 sin30) = (2.17, 1.25)", "P₂: (3.8 cos120, 3.8 sin120) = (−1.90, 3.29)", "d = √((−1.90−2.17)² + (3.29−1.25)²) = 4.55 m"], "a": "(2.17, 1.25), (−1.90, 3.29), d = 4.55 m", "pr": [{"q": "A vector is 5∠60°. What is its x-component?", "num": 2.5, "tol": 0.05, "unit": "", "why": "x = 5 cos60 = 2.5."}, {"q": "Distance between the polar points (4, 0°) and (4, 90°).", "num": 5.66, "tol": 0.1, "unit": "", "why": "They become (4,0) and (0,4), so d = √(16+16) = 5.66."}]}, {"t": 1, "n": 8, "ttl": "Two forces added", "q": "F₁ = 6.00 at 30° above +x, F₂ = 5.00 along +y. Find the resultant.", "m": ["Split each force into x and y, add the x's, add the y's.", "Then R = √(x²+y²) and θ = tan⁻¹(y/x)."], "w": ["Fx = 6 cos30 + 0 = 5.20   Fy = 6 sin30 + 5 = 8.00", "R = √(5.20² + 8.00²) = 9.54", "θ = tan⁻¹(8.00/5.20) = 57.0°"], "a": "9.54 units at 57.0°", "pr": [{"q": "F₁ = 8 at 0° and F₂ = 6 at 90°. Find the magnitude of the resultant.", "num": 10, "tol": 0.1, "unit": "", "why": "√(64+36) = 10."}, {"q": "Same forces, 8 at 0° and 6 at 90°. Find the angle from +x.", "num": 36.9, "tol": 0.6, "unit": "°", "why": "tan⁻¹(6/8) = 36.9°."}]}, {"t": 1, "n": 9, "ttl": "Successive displacements", "q": "A dog moves 3.50 m south, then 8.20 m northeast, then 15.0 m west. Resultant?", "m": ["Give every move an x and a y. South = −y, west = −x, northeast = 45°.", "Add the x's, add the y's, then magnitude and angle."], "w": ["(0, −3.50) + (5.80, 5.80) + (−15, 0)", "x = −9.20, y = +2.30", "R = √(84.6+5.3) = 9.49 m, θ = 166° (14° north of west)"], "a": "9.49 m at 166°", "pr": [{"q": "Moves 4 m south, 5 m northeast, 6 m west. Find the magnitude of the resultant.", "num": 2.51, "tol": 0.12, "unit": "m", "why": "x = 3.54 − 6 = −2.46, y = −4 + 3.54 = −0.46, R = 2.51 m."}, {"q": "In that same problem, which direction is the resultant?", "o": ["South-west", "North-west", "South-east", "Due west"], "a": 0, "why": "x is negative and y is negative, so the third quadrant, south-west."}]}, {"t": 1, "n": 10, "ttl": "Vector addition and subtraction", "q": "A = 2i + 6j and B = 3i − 2j. Find C = A + B and D = A − B, in unit vectors and in polar form.", "m": ["Add or subtract the i's and the j's separately.", "Then magnitude and angle for each, with the quadrant check."], "w": ["C = 5i + 4j → |C| = √41 = 6.40, θ = 38.7°", "D = −1i + 8j → |D| = √65 = 8.06, θ = 180 − 82.9 = 97.1°"], "a": "C = 5i+4j at 6.40, 38.7°; D = −i+8j at 8.06, 97.1°", "pr": [{"q": "A = 3i + 4j and B = i − 2j. Find |A + B|.", "num": 4.47, "tol": 0.06, "unit": "", "why": "A+B = 4i + 2j, so √(16+4) = 4.47."}, {"q": "Same vectors. Find |A − B|.", "num": 6.32, "tol": 0.06, "unit": "", "why": "A−B = 2i + 6j, so √(4+36) = 6.32."}]}, {"t": 1, "n": 11, "ttl": "Equilibrium of three pulls", "q": "F₁ = 120 N at 60°, F₂ = 80.0 N at 75°. Find the resultant and the force that cancels it.", "m": ["Add the x's and the y's, then R and θ.", "The cancelling force is the same size, opposite direction: add 180°."], "w": ["Fx = 120cos60 + 80cos75 = 80.7", "Fy = 120sin60 + 80sin75 = 181.2", "R = √(6513+32832) = 198 N at 66.0°", "Cancelling force: 198 N at 246°"], "a": "198 N at 66°, cancelled by 198 N at 246°", "pr": [{"q": "Forces of 100 N at 30° and 80 N at 120°. Find the magnitude of the resultant.", "num": 128, "tol": 1.5, "unit": "N", "why": "Fx = 86.6 − 40 = 46.6, Fy = 50 + 69.3 = 119.3, R = 128 N."}, {"q": "Forces 100 N at 0° and 100 N at 90°. What force keeps the point still?", "num": 141.4, "tol": 1.5, "unit": "N", "why": "Resultant is 141.4 N at 45°, so the balancing force is 141.4 N at 225°."}]}, {"t": 2, "n": 1, "ttl": "Displacement vs distance", "q": "Bike 1000 m to a store, then back to a friend halfway. Find displacement and distance, then again after you get home.", "m": ["Displacement = straight line from start to finish, sign matters.", "Distance = every metre you actually moved, always positive."], "w": ["At the friend: displacement = +500 m (500 m from home), distance = 1000 + 500 = 1500 m", "Back home: displacement = 0, distance = 1000 + 500 + 500 = 2000 m"], "a": "(a) +500 m  (b) 1500 m  (c) 0  (d) 2000 m", "pr": [{"q": "You walk 800 m to a shop, then back to a point halfway home. Displacement?", "num": 400, "tol": 2, "unit": "m", "why": "You finish 400 m from home, on the shop side, so +400 m."}, {"q": "Same trip. Total distance?", "num": 1200, "tol": 2, "unit": "m", "why": "800 out plus 400 back = 1200 m."}]}, {"t": 2, "n": 2, "ttl": "Reading a position-time graph", "q": "From a position-time graph: max speed, average velocity, average speed, velocity ratio, where velocity is zero.", "m": ["Slope of x-t = velocity. Steepest line = max speed.", "Velocity zero where the curve is flat. Average = (xf − xi)/(tf − ti)."], "w": ["Max speed: find the steepest straight segment and take its slope.", "Average velocity uses positions only. Average speed uses total distance.", "v = 0 wherever the graph is horizontal."], "a": "Slope everywhere, never the height.", "pr": [{"q": "On a position-time graph, what does the slope represent?", "o": ["Velocity", "Acceleration", "Distance", "Average speed"], "a": 0, "why": "Slope = Δx/Δt = velocity."}, {"q": "On a position-time graph, velocity is zero where the graph is…", "o": ["Steepest", "Flat (horizontal)", "Crossing the axis", "Curving down"], "a": 1, "why": "Zero slope means zero velocity. Crossing the axis only means x = 0."}]}, {"t": 2, "n": 3, "ttl": "Velocity and acceleration from x(t)", "q": "x = At³ + Bt² + Ct + D, with A = 2.10, B = 1.00, C = −4.10, D = 3.00. Find v at 10 s, where it is at rest, and a at 0.5 s.", "m": ["Differentiate once for v, twice for a. The constant D always dies.", "At rest means v = 0. Solve the quadratic."], "w": ["v = 3At² + 2Bt + C = 6.3t² + 2t − 4.1", "a = 6At + 2B = 12.6t + 2", "v(10) = 645.9 m/s; v = 0 at t = 0.663 s; a(0.5) = 8.3 m/s²"], "a": "v = 645.9 m/s, at rest at t = 0.663 s, a = 8.3 m/s²", "pr": [{"q": "x = 3t² + 2t. Find the velocity at t = 4 s.", "num": 26, "tol": 0.1, "unit": "m/s", "why": "v = 6t + 2 = 26 m/s."}, {"q": "Same x = 3t² + 2t. Find the acceleration.", "num": 6, "tol": 0.05, "unit": "m/s²", "why": "a = 6 m/s², constant."}]}, {"t": 2, "n": 4, "ttl": "Reading a velocity-time graph", "q": "From a v-t graph: average acceleration in each segment, and total distance from 0 to 24 s.", "m": ["Slope of v-t = acceleration.", "Area under v-t = distance. Count the rectangles and triangles."], "w": ["Each segment: a = (v₂ − v₁)/(t₂ − t₁)", "Distance: break the area into triangles ½bh and rectangles bh, then add them all."], "a": "Slope gives a, area gives distance.", "pr": [{"q": "On a velocity-time graph, the area under the line is…", "o": ["Acceleration", "Displacement", "Average velocity", "Force"], "a": 1, "why": "Area = v × t = displacement."}, {"q": "A v-t graph is flat and horizontal at 10 m/s for 6 s. Distance covered?", "num": 60, "tol": 0.5, "unit": "m", "why": "Rectangle: 10 × 6 = 60 m."}]}, {"t": 2, "n": 5, "ttl": "Non-constant acceleration", "q": "Starts from rest with a = Bt² − ½Ct, B = 2.0, C = −4.0. Find v and x after 5 s.", "m": ["Integrate a once for v, again for x. Start from rest means v₀ = 0 and x₀ = 0.", "Substitute the numbers only at the very end."], "w": ["a = 2t² + 2t (because −½C = +2)", "v = ⅔t³ + t² → v(5) = 83.3 + 25 = 108.3 m/s", "x = t⁴/6 + t³/3 → x(5) = 104.2 + 41.7 = 145.8 m"], "a": "v = 108.3 m/s, x = 145.8 m", "pr": [{"q": "a = 3t and the object starts from rest. Find v at t = 4 s.", "num": 24, "tol": 0.2, "unit": "m/s", "why": "v = ∫3t dt = 1.5t² = 1.5 × 16 = 24 m/s."}, {"q": "Same a = 3t from rest. Find the distance covered in the first 4 s.", "num": 32, "tol": 0.3, "unit": "m", "why": "x = ∫1.5t² dt = 0.5t³ = 0.5 × 64 = 32 m."}]}, {"t": 2, "n": 6, "ttl": "Thrown downwards", "q": "A ball is thrown straight down at 10.0 m/s from 50.0 m. When does it hit the ground?", "m": ["One equation: Δy = v₀t + ½at², with a = −9.8 and Δy = −50.", "It is a quadratic in t. Take the positive root."], "w": ["−50 = −10t − 4.9t²  →  4.9t² + 10t − 50 = 0", "t = (−10 + √(100+980)) / 9.8"], "a": "t = 2.33 s", "pr": [{"q": "Thrown down at 5 m/s from 20 m. How long to hit the ground?", "num": 1.57, "tol": 0.05, "unit": "s", "why": "4.9t² + 5t − 20 = 0 gives t = 1.57 s."}, {"q": "Thrown down at 5 m/s from 20 m. What is the impact speed?", "num": 20.4, "tol": 0.4, "unit": "m/s", "why": "v² = 25 + 2(9.8)(20) = 417, v = 20.4 m/s."}]}, {"t": 3, "n": 1, "ttl": "Two stones, same landing time", "q": "Building 19.6 m. Stone A thrown up, stone B dropped 2.00 s later. Both land together. Find v₀ of A, the max height of A, and both impact speeds.", "m": ["Start with the dropped stone. It has no v₀, so it gives you the total time.", "A spends that time plus 2 s in the air. One equation then gives v₀."], "w": ["B: 19.6 = ½(9.8)t² → t = 2.00 s. So A is in the air 4.00 s.", "A: −19.6 = v₀(4) − 4.9(16) → v₀ = +14.7 m/s", "Max height: 19.6 + 14.7²/(2×9.8) = 30.6 m", "Impact: vA = 14.7 − 39.2 = −24.5 m/s, vB = −19.6 m/s"], "a": "v₀ = 14.7 m/s, height 30.6 m, −24.5 and −19.6 m/s", "pr": [{"q": "Building 45 m. A is thrown up, B dropped 1 s later, both land together. Find v₀ of A.", "num": 8.58, "tol": 0.3, "unit": "m/s", "why": "B takes 3.03 s, so A takes 4.03 s: −45 = v₀(4.03) − 4.9(16.2), v₀ = 8.58 m/s."}, {"q": "For that same building, how long is stone B in the air?", "num": 3.03, "tol": 0.06, "unit": "s", "why": "√(2×45/9.8) = 3.03 s."}]}, {"t": 3, "n": 2, "ttl": "Cannonball at a wall", "q": "Fired at 30.0 m/s at a target 60.0 m away and 15.0 m up. Find both possible angles and their times.", "m": ["Use y = x tanθ − gx²/(2v²cos²θ) and put everything in terms of T = tanθ.", "That gives a quadratic in T. Two roots = the two angles. Then t = x/(v cosθ)."], "w": ["15 = 60T − 19.6(1 + T²) → 19.6T² − 60T + 34.6 = 0", "T = 2.29 → 66.4°, and T = 0.770 → 37.6°", "t = 60/(30cosθ) → 5.00 s and 2.53 s"], "a": "66.4° in 5.00 s, or 37.6° in 2.53 s", "pr": [{"q": "v = 25 m/s, target 50 m away and 10 m up. Find the smaller launch angle.", "num": 43, "tol": 1.2, "unit": "°", "why": "19.6T² − 50T + 29.6 = 0 gives T = 0.932 → 43.0° (the other root is 58.3°)."}, {"q": "Same shot at 43.0°. How long is it in the air?", "num": 2.74, "tol": 0.1, "unit": "s", "why": "t = 50/(25 cos43) = 2.74 s."}]}, {"t": 3, "n": 3, "ttl": "Clearing the crossbar", "q": "Ball kicked at 22.4 m/s, 49.0°, from 39.0 m out. Crossbar is 3.05 m. Does it clear, and by how much?", "m": ["Find the time to reach the goalpost from x: t = x/(v cosθ).", "Put that t into y = v sinθ · t − ½gt². Compare with the bar height."], "w": ["t = 39/(22.4 cos49) = 2.65 s", "y = 16.9(2.65) − 4.9(2.65)² = 10.35 m", "10.35 − 3.05 = 7.30 m over"], "a": "Clears by 7.30 m; vertical velocity at the post is −9.10 m/s", "pr": [{"q": "Kicked at 20 m/s at 35° from 30 m out. Height when it reaches the post?", "num": 4.58, "tol": 0.2, "unit": "m", "why": "t = 30/(20cos35) = 1.83 s, y = 11.47(1.83) − 4.9(3.35) = 4.58 m."}, {"q": "That same kick at 20 m/s, 35°, 30 m out. Does it clear a 2.50 m bar?", "o": ["Yes", "No"], "a": 0, "why": "4.58 m is above 2.50 m, so it clears by 2.08 m."}]}, {"t": 3, "n": 4, "ttl": "Landing on a higher platform", "q": "Ball thrown at 20 m/s at 40° lands on a platform 5 m higher. Find the time, the horizontal distance, and the impact speed.", "m": ["Vertical equation with Δy = +5: 5 = v₀sinθ t − 4.9t². Solve the quadratic, take the later root.", "Then x = vₓt, and the speed is √(vₓ² + vy²) with vy = v₀sinθ − gt."], "w": ["4.9t² − 12.86t + 5 = 0 → t = 2.15 s", "x = 15.32 × 2.15 = 32.9 m", "vy = 12.86 − 21.06 = −8.20 → v = √(15.32² + 8.20²) = 17.4 m/s"], "a": "t = 2.15 s, x = 32.9 m, v = 17.4 m/s", "pr": [{"q": "15 m/s at 45°, platform 3 m higher. Find the time of flight.", "num": 1.83, "tol": 0.08, "unit": "s", "why": "4.9t² − 10.61t + 3 = 0, the later root is 1.83 s."}, {"q": "Same throw. How far horizontally does it travel?", "num": 19.4, "tol": 0.6, "unit": "m", "why": "x = 10.61 × 1.83 = 19.4 m."}]}, {"t": 3, "n": 5, "ttl": "Horizontal launch off a cliff", "q": "Stone thrown horizontally at 15 m/s from a 50 m cliff. Find the time, the range, and the impact speed.", "m": ["Horizontal launch means v₀y = 0, so the fall is just 50 = ½gt².", "That t is shared. Range = vₓt, then combine vₓ with vy = gt for the speed."], "w": ["50 = 4.9t² → t = 3.19 s", "x = 15 × 3.19 = 47.9 m", "vy = 9.8 × 3.19 = 31.3 → v = √(15² + 31.3²) = 34.7 m/s"], "a": "t = 3.19 s, range 47.9 m, impact 34.7 m/s", "pr": [{"q": "Thrown horizontally at 20 m/s from 80 m. How long to hit the ground?", "num": 4.04, "tol": 0.08, "unit": "s", "why": "80 = 4.9t², so t = 4.04 s."}, {"q": "Same throw. How far from the base does it land?", "num": 80.8, "tol": 2, "unit": "m", "why": "x = 20 × 4.04 = 80.8 m."}]}, {"t": 4, "n": 1, "ttl": "Elevator tension", "q": "Cabin 358.1 kg plus people 169.2 kg, accelerating up at 4.11 m/s². Find the cable tension.", "m": ["Add the masses first: it is one object.", "Accelerating up means T = m(g + a). Accelerating down would be m(g − a)."], "w": ["m = 358.1 + 169.2 = 527.3 kg", "T = m(g + a) = 527.3(9.8 + 4.11)", "T = 527.3 × 13.91"], "a": "T = 7.33 × 10³ N", "pr": [{"q": "An elevator of total mass 400 kg accelerates upward at 2 m/s². Find the tension.", "num": 4720, "tol": 30, "unit": "N", "why": "T = m(g+a) = 400 × 11.8 = 4720 N."}, {"q": "Same 400 kg elevator, moving up at constant speed. Find the tension.", "num": 3920, "tol": 30, "unit": "N", "why": "Constant speed means a = 0, so T = mg = 400 × 9.8 = 3920 N."}]}, {"t": 4, "n": 2, "ttl": "Four forces, one point still", "q": "Three pulls: 150 N at 60°, 200 N at 100°, 100 N at 190°. Find the force that keeps the point still.", "m": ["Add all the x's and all the y's. That is the sum of the three.", "The equilibrium force is the same size, opposite direction, so flip both signs."], "w": ["Fx = 75 − 34.7 − 98.5 = −58.2    Fy = 129.9 + 197.0 − 17.4 = 309.5", "Balance force = (+58.2, −309.5)", "|F| = 315 N, θ = 280.7° (or 79.3° below +x)"], "a": "315 N at 280.7°", "pr": [{"q": "Two forces 100 N at 0° and 100 N at 90°. What force keeps the point still?", "num": 141.4, "tol": 1.5, "unit": "N", "why": "Sum is 141.4 N at 45°, so the balancing force is 141.4 N at 225°."}, {"q": "Same two forces. What is the angle of the balancing force?", "num": 225, "tol": 2, "unit": "°", "why": "Opposite of 45° is 45 + 180 = 225°."}]}, {"t": 4, "n": 3, "ttl": "Ramp and hanging mass at constant speed", "q": "m₁ = 20.0 kg on a 30° frictionless ramp moves up at constant speed, pulled by hanging m₂. Find m₂.", "m": ["Constant speed means a = 0, so no ma at all. Only balance.", "The pull down the ramp is m₁g sinθ. The hanging weight is m₂g. Set them equal."], "w": ["m₂g = m₁g sin30", "m₂ = 20 × 0.5"], "a": "m₂ = 10.0 kg", "pr": [{"q": "m₁ = 10 kg on a 20° frictionless ramp at constant speed. Find m₂.", "num": 3.42, "tol": 0.15, "unit": "kg", "why": "m₂ = 10 sin20 = 3.42 kg."}, {"q": "Why does the angle matter here but not the mass of the hanging block?", "o": ["Because only the component along the ramp counts", "Because g cancels out", "Because friction is zero", "Because the string is massless"], "a": 0, "why": "Only m₁g sinθ acts along the ramp. The rest is held by the normal force."}]}, {"t": 4, "n": 4, "ttl": "Stopping without the load sliding", "q": "Truck at 30.0 m/s, μs = 0.540 between block and bed. Minimum stopping distance so the block does not slide?", "m": ["The block can only slow down as fast as friction allows: a = μs g.", "Then use v² = 2ad with vf = 0, so d = v² / (2a)."], "w": ["a = 0.540 × 9.8 = 5.29 m/s²", "d = 30² / (2 × 5.29)", "d = 900 / 10.58"], "a": "d = 85.0 m", "pr": [{"q": "μs = 0.40 and the truck is doing 20 m/s. Minimum stopping distance?", "num": 51, "tol": 1.5, "unit": "m", "why": "a = 3.92, d = 400/(2×3.92) = 51.0 m."}, {"q": "With μs = 0.40, what is the maximum safe deceleration?", "num": 3.92, "tol": 0.15, "unit": "m/s²", "why": "a = μs g = 0.40 × 9.8 = 3.92 m/s²."}]}, {"t": 4, "n": 5, "ttl": "Two masses in an elevator", "q": "M₁ = 2.00 kg hangs from the ceiling, M₂ = 4.00 kg hangs below it. Find T₁ at constant velocity, then accelerating up at 3.00 m/s².", "m": ["The top string carries both masses: m = M₁ + M₂.", "Constant velocity → T = mg. Accelerating up → T = m(g + a)."], "w": ["m = 6.00 kg", "(a) T = 6 × 9.8 = 58.8 N", "(b) T = 6 × 12.8 = 76.8 N"], "a": "58.8 N, then 76.8 N", "pr": [{"q": "M₁ = 3 kg with M₂ = 2 kg below it, accelerating up at 2 m/s². Find T₁.", "num": 59, "tol": 1.5, "unit": "N", "why": "T = 5 × (9.8+2) = 59 N."}, {"q": "Same 3 kg and 2 kg, now at constant velocity. Find T₁.", "num": 49, "tol": 1, "unit": "N", "why": "T = 5 × 9.8 = 49 N."}]}, {"t": 4, "n": 6, "ttl": "The five concept questions", "q": "Straight from the sheet: Newton's laws in words.", "m": ["No net force = rest or constant velocity. Never 'it slows down by itself'.", "Action and reaction are equal and opposite, on different bodies. Mass does not matter."], "w": ["Spacecraft with engines off: same speed, same direction, forever.", "Truck vs car: equal and opposite forces.", "Hard to start a crate, easier to keep it moving: μs > μk.", "Scale reads more than mg only when accelerating upward.", "Rope at an angle pulls up, so N < mg."], "a": "b, c, b, d, c", "pr": [{"q": "A puck slides at constant velocity on frictionless ice. The net force on it is…", "o": ["Zero", "Equal to mg", "Forward, to keep it moving", "Backward, against the motion"], "a": 0, "why": "Constant velocity means zero acceleration, so zero net force."}, {"q": "You push a crate at a steady 45° upward angle. How does N compare with mg?", "o": ["N = mg", "N > mg", "N < mg", "N = 0"], "a": 2, "why": "The vertical part of your push lifts the crate, so the floor pushes back less."}]}];
const KEY = "ph111-exam-v1";
let A = {};
try{ A = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ A = {}; }
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(A)); }catch(e){} };
const $ = id => document.getElementById(id);
let S = {v:"home", t:1};

function k(p,i){ return p.t+"-"+p.n+"-"+i; }
function done(p){ let got=0,n=0; p.pr.forEach((q,i)=>{ n++; if(A[k(p,i)]) got++; }); return {got,n}; }
function tutScore(t){
  let got=0,n=0;
  P.filter(p=>p.t===t).forEach(p=>{ const d=done(p); got+=d.got; n+=d.n; });
  return {got,n};
}

function renderHome(){
  $("bt").textContent="C-PH111 · Fall 2026"; $("bs").textContent="Exam questions, solved";
  $("back").classList.add("hide"); $("tally").textContent="";
  const names=["Tutorial 1 · Units & Vectors","Tutorial 2 · Motion in 1D","Tutorial 3 · Motion in 2D","Tutorial 4 · Forces"];
  const subs=["11 questions","6 questions","5 questions","6 questions"];
  let cards="", tg=0, tn=0;
  names.forEach((nm,i)=>{
    const t=i+1, sc=tutScore(t); tg+=sc.got; tn+=sc.n;
    cards += `<button class="tcard" data-t="${t}">
      <span class="n">T${t}</span>
      <span class="x"><span class="tt">${nm.split(" · ")[1]}</span><span class="dd">${nm.split(" · ")[0]} · ${subs[i]}</span></span>
      <span class="p ${sc.got===sc.n&&sc.n?'ok':''}">${sc.got}/${sc.n}</span></button>`;
  });
  $("view").innerHTML = `
    <div class="eyebrow">Your professor said these exact questions</div>
    <h1>Ammar: learn<br><em>the method.</em></h1>
    <p class="lead">Same questions in the exam, different numbers. So each one below is: the question, the 2-step method, the worked answer, then 2 of your own to check.</p>
    ${cards}
    <p class="note">${tg}/${tn} practice questions correct</p>
    <p class="note" style="margin-top:18px"><a href="concepts.html" style="color:var(--teal);font-weight:600;text-decoration:none">Need the theory first? Open the concepts pages →</a></p>`;
  document.querySelectorAll(".tcard").forEach(b=>b.onclick=()=>{ S.t=+b.dataset.t; S.v="tut"; render(); window.scrollTo(0,0); });
}

function renderTut(){
  const t=S.t, list=P.filter(p=>p.t===t), sc=tutScore(t);
  $("bt").textContent = "Tutorial "+t;
  $("bs").textContent = ["Units & Vectors","Motion in 1D","Motion in 2D","Forces"][t-1];
  $("back").classList.remove("hide");
  $("tally").textContent = sc.got+"/"+sc.n;
  $("view").innerHTML = list.map((p,idx)=>probHTML(p,idx)).join("") + `
    <div class="foot">
      <button class="btn ghost" id="homeBtn">All tutorials</button>
      ${t<4?`<button class="btn" id="nextBtn">Tutorial ${t+1} →</button>`:``}
    </div>`;
  $("back").onclick=()=>{ S.v="home"; render(); window.scrollTo(0,0); };
  $("homeBtn").onclick=()=>{ S.v="home"; render(); window.scrollTo(0,0); };
  if($("nextBtn")) $("nextBtn").onclick=()=>{ S.t++; render(); window.scrollTo(0,0); };
  bind(list);
}

function probHTML(p){
  const qs = p.pr.map((q,i)=>{
    const id = p.t+"-"+p.n+"-"+i;
    const body = q.o
      ? `<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-id="${id}" data-j="${j}" data-a="${q.a}">${o}</button>`).join("")}</div>`
      : `<div class="row">
           <input data-id="${id}" inputmode="decimal" placeholder="answer" autocomplete="off">
           <span class="u">${q.unit||""}</span>
           <button class="btn" data-go="${id}">Check</button>
         </div>`;
    return `<div class="pr"><p class="q">${q.q}</p>${body}<div class="w" id="w-${id}"></div></div>`;
  }).join("");
  return `<div class="prob">
    <div class="ph"><span class="pn">${p.n}</span><span class="pt">${p.ttl}</span></div>
    <p class="pq">${p.q}</p>
    <div class="lbl">The method</div>
    <div class="meth">${p.m.map(s=>`<p>${s}</p>`).join("")}</div>
    <details class="ans"><summary>Show the worked answer</summary>
      <div class="in">${p.w.map(l=>`<div class="ln">${l}</div>`).join("")}<div class="res">${p.a}</div></div>
    </details>
    <div class="try"><div class="th">Try it yourself · ${p.pr.length} questions</div>${qs}</div>
  </div>`;
}

function bind(list){
  list.forEach(p=>{
    p.pr.forEach((q,i)=>{
      const id = p.t+"-"+p.n+"-"+i;
      if(q.o){
        document.querySelectorAll(`.opt[data-id="${id}"]`).forEach(b=>{
          b.onclick=()=>{
            const j=+b.dataset.j, ok = j===q.a;
            document.querySelectorAll(`.opt[data-id="${id}"]`).forEach((x,jj)=>{
              x.disabled=true;
              if(jj===q.a) x.classList.add("good");
              if(jj===j && !ok) x.classList.add("bad");
            });
            show(id, ok, q.why, null);
          };
        });
      } else {
        const btn=document.querySelector(`.btn[data-go="${id}"]`);
        const inp=document.querySelector(`input[data-id="${id}"]`);
        const go=()=>{
          const v=parseFloat((inp.value||"").replace(",","."));
          if(isNaN(v)){ inp.focus(); return; }
          const ok = Math.abs(v-q.num) <= q.tol;
          inp.disabled=true; btn.disabled=true; btn.textContent="Done";
          show(id, ok, q.why, q.num+(q.unit?" "+q.unit:""));
        };
        btn.onclick=go;
        inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
      }
    });
  });
}

function show(id, ok, why, ansTxt){
  const w=$("w-"+id);
  w.className="w on "+(ok?"ok":"no");
  w.innerHTML = (ok?"<b>Correct.</b> ":"<b>Not quite.</b> ")+why+(ok?"":(ansTxt?" Answer: <b>"+ansTxt+"</b>.":""));
  if(!A[id]){ A[id]={ok:ok}; save(); }
  if(S.v==="tut"){ const sc=tutScore(S.t); $("tally").textContent=sc.got+"/"+sc.n; }
}

function render(){ S.v==="home"?renderHome():renderTut(); }
render();
</script>
